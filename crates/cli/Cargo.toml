[package]
name = "clins-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native CLI and HTTP host for offline JP-CLINS validation"

[dependencies]
anyhow.workspace = true
clins-core.workspace = true
clins-packages.workspace = true
clins-server.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "clins"
path = "src/main.rs"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

tar = "0.4"
flate2 = "1"
