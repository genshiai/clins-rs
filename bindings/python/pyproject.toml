[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"
[project]
name = "clins-py"
version = "0.1.0a1"
requires-python = ">=3.10"
description = "Offline FHIR R4 / JP-CLINS validation backed by Rust"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.txt"]
[tool.maturin]
python-source = "python"
module-name = "clins_py._clins"
