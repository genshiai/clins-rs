name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check.sh
      - run: python3 scripts/smoke-http.py target/debug/clins
      - run: cargo package --locked -p clins-core
      - run: cargo build --locked --release -p clins-cli
      - run: cargo run --locked -p clins-cli --example rule_inventory > data/rule-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-artifacts-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/clins
            target/package/clins-core-*.crate
            data/rule-inventory.json
  sdks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p clins-cli -- --packages clins-packages.lock.json prepare
      - run: cargo run --locked -p clins-cli -- --packages clins-packages.lock.json export-definitions > data/definitions.json
      - run: python -m pip install 'maturin>=1.10,<2'
      - run: maturin build --release --locked --manifest-path bindings/python/Cargo.toml --out dist
      - run: python -m pip install --no-deps dist/clins_py-*.whl
      - run: python -m unittest discover -s bindings/python/tests
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: ./scripts/build-wasm.sh
      - run: bun test bindings/typescript/tests/validator.test.ts
      - run: node --test bindings/typescript/tests/node.test.mjs
      - run: bun install --frozen-lockfile
        working-directory: bindings/typescript
      - run: bunx playwright install --with-deps chromium
        working-directory: bindings/typescript
      - run: bunx tsc
        working-directory: bindings/typescript
      - run: bunx playwright test
        working-directory: bindings/typescript
      - run: npm pack --pack-destination ../../dist
        working-directory: bindings/typescript
      - run: ./gradlew -Pclins.release=true test jar nativeJar publishAllPublicationsToLocalBuildRepository --no-daemon
        working-directory: bindings/kotlin
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-artifacts-linux-x86-64
          path: |
            dist/*.whl
            dist/*.tgz
            bindings/typescript/pkg
            bindings/kotlin/build/libs/*.jar
            bindings/kotlin/build/repository
